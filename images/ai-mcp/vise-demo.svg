<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .cycle { animation-duration: 10s; animation-iteration-count: infinite; animation-fill-mode: both; }
    @keyframes ask   { 0%, 4%  { opacity: 0; transform: translateY(8px); } 10%, 93% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
    @keyframes plan  { 0%, 14% { opacity: 0; } 20%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes check { 0%, 26% { opacity: 0; transform: translateX(-6px); } 32%, 93% { opacity: 1; transform: translateX(0); } 98%, 100% { opacity: 0; } }
    @keyframes chip  { 0%, 58% { opacity: 0; transform: scale(0.85); } 64%, 93% { opacity: 1; transform: scale(1); } 98%, 100% { opacity: 0; } }
    .ask { animation-name: ask; } .plan { animation-name: plan; }
    .chk { animation-name: check; } .chip { animation-name: chip; transform-box: fill-box; transform-origin: center; }
    .c2 { animation-delay: 0.7s; } .c3 { animation-delay: 1.4s; } .c4 { animation-delay: 2.1s; }
    @media (prefers-reduced-motion: reduce) { .cycle { animation: none; } }
  </style>
  <rect x="0" y="0" width="760" height="400" rx="18" fill="#101324"/>
  <!-- left column -->
  <text x="44" y="76" fill="#6366f1" font-size="13" font-weight="600" letter-spacing="2">VISE</text>
  <text x="44" y="112" fill="#f4f5ff" font-size="26" font-weight="700">AI-built. Verified.</text>
  <text x="44" y="140" fill="#9aa1c0" font-size="14">Your coding agent plans, implements,</text>
  <text x="44" y="160" fill="#9aa1c0" font-size="14">and proves the work — with checks.</text>
  <text x="44" y="212" fill="#9aa1c0" font-size="12" font-weight="600" letter-spacing="1">WHAT IT CHECKS</text>
  <circle cx="50" cy="238" r="3.5" fill="#6366f1"/>
  <text x="64" y="243" fill="#e8eaff" font-size="14">Real SDK usage, not guessed APIs</text>
  <circle cx="50" cy="268" r="3.5" fill="#3b41ec" opacity="0.45"/>
  <text x="64" y="273" fill="#9aa1c0" font-size="14">Lifecycle and feature completeness</text>
  <circle cx="50" cy="298" r="3.5" fill="#3b41ec" opacity="0.45"/>
  <text x="64" y="303" fill="#9aa1c0" font-size="14">Your project's own validation</text>
  <!-- terminal panel -->
  <rect x="410" y="40" width="310" height="320" rx="14" fill="#181d36"/>
  <circle cx="432" cy="62" r="4" fill="#2b3157"/><circle cx="446" cy="62" r="4" fill="#2b3157"/><circle cx="460" cy="62" r="4" fill="#2b3157"/>
  <g class="cycle ask">
    <text x="430" y="96" fill="#6366f1" font-size="12" font-family="ui-monospace, monospace">&gt;</text>
    <text x="444" y="96" fill="#e8eaff" font-size="12">Add a social feed using social.plus</text>
  </g>
  <g class="cycle plan">
    <text x="430" y="126" fill="#9aa1c0" font-size="11.5">Planning from docs and SDK facts…</text>
  </g>
  <g class="cycle chk">
    <text x="430" y="158" fill="#4ade80" font-size="12" font-weight="700">✓</text>
    <text x="448" y="158" fill="#e8eaff" font-size="12">SDK usage</text>
  </g>
  <g class="cycle chk c2">
    <text x="430" y="184" fill="#4ade80" font-size="12" font-weight="700">✓</text>
    <text x="448" y="184" fill="#e8eaff" font-size="12">Lifecycle behavior</text>
  </g>
  <g class="cycle chk c3">
    <text x="430" y="210" fill="#4ade80" font-size="12" font-weight="700">✓</text>
    <text x="448" y="210" fill="#e8eaff" font-size="12">Feature completeness</text>
  </g>
  <g class="cycle chk c4">
    <text x="430" y="236" fill="#4ade80" font-size="12" font-weight="700">✓</text>
    <text x="448" y="236" fill="#e8eaff" font-size="12">Project validation commands</text>
  </g>
  <g class="cycle chip">
    <rect x="430" y="266" width="262" height="60" rx="10" fill="#123c2e"/>
    <text x="446" y="291" fill="#4ade80" font-size="12.5" font-weight="700">Honest handoff</text>
    <text x="446" y="311" fill="#9adfc0" font-size="10">What passed, what's next — evidence in sp-vise/</text>
  </g>
</svg>
