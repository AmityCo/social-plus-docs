<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .cycle { animation-duration: 9s; animation-iteration-count: infinite; animation-fill-mode: both; }
    @keyframes qpop { 0%, 6% { opacity: 0; transform: translateY(8px); } 12%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    @keyframes apop { 0%, 20% { opacity: 0; transform: translateY(8px); } 27%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    @keyframes bar  { 0%, 24% { transform: scaleY(0); } 40%, 92% { transform: scaleY(1); } 97%, 100% { transform: scaleY(0); } }
    @keyframes chip { 0%, 42% { opacity: 0; transform: scale(0.8); } 48%, 92% { opacity: 1; transform: scale(1); } 97%, 100% { opacity: 0; } }
    .q { animation-name: qpop; }
    .a { animation-name: apop; }
    .bar { animation-name: bar; transform-box: fill-box; transform-origin: bottom; }
    .chip { animation-name: chip; transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { .cycle { animation: none; } }
    .b2 { animation-delay: 0.12s; } .b3 { animation-delay: 0.24s; } .b4 { animation-delay: 0.36s; }
    .b5 { animation-delay: 0.48s; } .b6 { animation-delay: 0.6s; } .b7 { animation-delay: 0.72s; } .b8 { animation-delay: 0.84s; }
  </style>
  <!-- stage -->
  <rect x="0" y="0" width="760" height="400" rx="18" fill="#101324"/>
  <!-- left column -->
  <text x="44" y="76" fill="#6366f1" font-size="13" font-weight="600" letter-spacing="2">AGENTRY</text>
  <text x="44" y="112" fill="#f4f5ff" font-size="26" font-weight="700">Ask your data anything</text>
  <text x="44" y="140" fill="#9aa1c0" font-size="14">Plain-language answers from your first-party data,</text>
  <text x="44" y="160" fill="#9aa1c0" font-size="14">in the AI apps your team already uses.</text>
  <text x="44" y="212" fill="#9aa1c0" font-size="12" font-weight="600" letter-spacing="1">TRY ASKING</text>
  <circle cx="50" cy="238" r="3.5" fill="#6366f1"/>
  <text x="64" y="243" fill="#e8eaff" font-size="14">How did engagement change this month?</text>
  <circle cx="50" cy="268" r="3.5" fill="#3b41ec" opacity="0.45"/>
  <text x="64" y="273" fill="#9aa1c0" font-size="14">Which communities are most active?</text>
  <circle cx="50" cy="298" r="3.5" fill="#3b41ec" opacity="0.45"/>
  <text x="64" y="303" fill="#9aa1c0" font-size="14">What changed in flagged content?</text>
  <!-- chat panel -->
  <rect x="410" y="40" width="310" height="320" rx="14" fill="#181d36"/>
  <!-- user bubble -->
  <g class="cycle q">
    <rect x="452" y="62" width="248" height="40" rx="12" fill="#3b41ec"/>
    <text x="468" y="87" fill="#ffffff" font-size="12.5">How did engagement change this month?</text>
  </g>
  <!-- answer -->
  <g class="cycle a">
    <text x="430" y="140" fill="#e8eaff" font-size="13" font-weight="600">Engagement is up 23% this month —</text>
    <text x="430" y="158" fill="#e8eaff" font-size="13" font-weight="600">a strong finish.</text>
    <text x="430" y="182" fill="#9aa1c0" font-size="12">48.2K reactions · 12.6K comments · 9,400 posts</text>
  </g>
  <!-- chart -->
  <g class="cycle a">
    <text x="430" y="226" fill="#9aa1c0" font-size="11" font-weight="600" letter-spacing="1">WEEKLY ENGAGEMENT</text>
  </g>
  <g>
    <rect class="cycle bar"    x="430" y="300" width="26" height="34"  rx="4" fill="#2b3157"/>
    <rect class="cycle bar b2" x="464" y="290" width="26" height="44"  rx="4" fill="#2b3157"/>
    <rect class="cycle bar b3" x="498" y="296" width="26" height="38"  rx="4" fill="#2b3157"/>
    <rect class="cycle bar b4" x="532" y="280" width="26" height="54"  rx="4" fill="#3a4180"/>
    <rect class="cycle bar b5" x="566" y="270" width="26" height="64"  rx="4" fill="#3a4180"/>
    <rect class="cycle bar b6" x="600" y="256" width="26" height="78"  rx="4" fill="#565ef0"/>
    <rect class="cycle bar b7" x="634" y="246" width="26" height="88"  rx="4" fill="#565ef0"/>
    <rect class="cycle bar b8" x="668" y="238" width="26" height="96"  rx="4" fill="#6366f1"/>
  </g>
  <line x1="430" y1="334" x2="700" y2="334" stroke="#2b3157" stroke-width="1"/>
  <!-- delta chip -->
  <g class="cycle chip">
    <rect x="632" y="200" width="64" height="26" rx="13" fill="#123c2e"/>
    <text x="664" y="217" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">+23%</text>
  </g>
</svg>
